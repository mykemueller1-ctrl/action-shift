<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Action Shift</title>
  <style>
    :root { --paper:#f4efe6; --ink:#1a1714; --mute:#6b645b; --rule:#d9d0c3; --move:#8b1e1e; --hold:#8a6a12; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Georgia,serif; }
    main { max-width:720px; margin:0 auto; padding:2.5rem 1.25rem 4rem; }
    h1 { font-size:42px; font-style:italic; font-weight:500; margin:0 0 .4rem; }
    .eyebrow { letter-spacing:.16em; font-size:11px; text-transform:uppercase; }
    .mute { color:var(--mute); max-width:520px; }
    label { display:block; margin-top:12px; }
    input, textarea, button { font:inherit; }
    input, textarea { display:block; width:100%; margin-top:6px; padding:10px 12px; border:1px solid var(--rule); background:#fff; }
    button { margin-top:8px; margin-right:8px; padding:12px 16px; background:var(--ink); color:var(--paper); border:0; cursor:pointer; }
    pre { white-space:pre-wrap; background:#fff; padding:16px; margin-top:20px; border:1px solid var(--rule); }
    .hold { color:var(--hold); }
    .err { color:var(--move); }
    #out { margin-top:36px; border-top:1px solid var(--rule); padding-top:24px; display:none; }
  </style>
</head>
<body>
<main>
  <p class="eyebrow">Action Shift · Never 86'd</p>
  <h1>Last night.</h1>
  <p class="mute">This house is Community Tap. Kenzy runs it. Lab dollars from another house stay labeled lab. I will not invent food cost. I will not ask for a schedule photo.</p>

  <label>House <input id="store" value="Community Tap" /></label>
  <label>Business date <input id="date" placeholder="last night" /></label>
  <label>Net sales <input id="net" placeholder="paste CTap net" /></label>
  <label>Labor dollars <input id="labor" placeholder="paste CTap labor" /></label>
  <label>House labor target % <input id="target" value="30" /></label>
  <label>One manager <input id="mgr" value="Kenzy" /></label>
  <label>Or paste a Toast line
    <textarea id="paste" rows="4" placeholder="Net $0.00  Labor $0.00"></textarea>
  </label>
  <p class="mute" id="preview"></p>
  <button id="load">Load lab fixture (not CTap)</button>
  <button id="close">Close last night</button>
  <p class="err" id="err"></p>

  <section id="out">
    <p class="eyebrow" id="verdict"></p>
    <p style="font-size:32px;margin:8px 0" id="pct"></p>
    <p id="formula"></p>
    <p id="move"></p>
    <p class="hold" id="hold"></p>
    <pre id="text"></pre>
    <button id="send">Send this to Kenzy</button>
  </section>
</main>
<script>
function money(n) {
  return n.toLocaleString("en-US", { style: "currency", currency: "USD" });
}
function scrape(text) {
  const labeledNet = text.match(/net[^0-9$]{0,16}\$?([0-9,]+(?:\.[0-9]{1,2})?)/i);
  const labeledLabor = text.match(/labor[^0-9$]{0,16}\$?([0-9,]+(?:\.[0-9]{1,2})?)/i);
  const moneyBits = [...text.matchAll(/\$?([0-9]{1,3}(?:,[0-9]{3})+(?:\.[0-9]{1,2})?|[0-9]+\.[0-9]{2})/g)].map(m => Number(m[1].replace(/,/g, "")));
  const netSales = labeledNet ? Number(labeledNet[1].replace(/,/g, "")) : moneyBits[0];
  const laborDollars = labeledLabor ? Number(labeledLabor[1].replace(/,/g, "")) : moneyBits[1];
  return {
    netSales: Number.isFinite(netSales) ? netSales : undefined,
    laborDollars: Number.isFinite(laborDollars) ? laborDollars : undefined,
  };
}
function closeNight(raw) {
  const laborPct = (raw.laborDollars / raw.netSales) * 100;
  const targetDollars = raw.netSales * (raw.laborTargetPct / 100);
  const heavyDollars = raw.laborDollars - targetDollars;
  const date = raw.businessDate || null;
  let verdict = "CLEAN";
  let move = "Labor is inside the house target. Keep the same plan tomorrow. Do not invent a cut.";
  if (heavyDollars > 25) {
    verdict = "MOVE";
    move = "Labor is " + money(heavyDollars) + " heavy vs a " + raw.laborTargetPct.toFixed(0) + "% floor. Cut one mid shift before the rush. Keep the peak window staffed.";
  }
  const hold = "HOLD food cost. No same-scope invoices and count. Invoice day is not daily prime.";
  if (verdict === "CLEAN") verdict = "HOLD";
  const sendText = [
    "Labor " + (date || "last night") + ": " + money(raw.laborDollars) + " on " + money(raw.netSales) + " net = " + laborPct.toFixed(2) + "%.",
    "Target here is " + raw.laborTargetPct.toFixed(0) + "%.",
    "Move: " + move,
    hold,
    "Reply with done or the reason it did not happen."
  ].join("\n");
  return { laborPct, heavyDollars, verdict, move, hold, sendText, formula: money(raw.laborDollars) + " \u00f7 " + money(raw.netSales) + " = " + laborPct.toFixed(2) + "%" };
}
const $ = (id) => document.getElementById(id);
$("paste").addEventListener("input", () => {
  const p = scrape($("paste").value);
  $("preview").textContent = p.netSales ? ("Read from paste: net " + p.netSales + " \u00b7 labor " + (p.laborDollars ?? "\u2014")) : "";
});
$("load").onclick = () => {
  $("store").value = "Lab fixture — not Community Tap";
  $("date").value = "lab";
  $("net").value = "3408.15";
  $("labor").value = "1211.85";
  $("target").value = "30";
  $("mgr").value = "the manager";
  $("paste").value = "LAB Net $3,408.15 Labor $1,211.85 — not CTap";
  $("preview").textContent = "Lab fixture only. Not Community Tap. Not Kenzy's night.";
};
$("close").onclick = () => {
  $("err").textContent = "";
  const p = scrape($("paste").value);
  const net = Number($("net").value || p.netSales);
  const labor = Number($("labor").value || p.laborDollars);
  const target = Number($("target").value || 30);
  if (!(net > 0) || !(labor >= 0)) {
    $("out").style.display = "none";
    $("err").textContent = "Need net sales and labor dollars for one store, one day.";
    return;
  }
  const r = closeNight({ netSales: net, laborDollars: labor, laborTargetPct: target, businessDate: $("date").value });
  const mgr = $("mgr").value || "the manager";
  const house = $("store").value || "this house";
  const body = "Hey " + mgr + " \u2014\n" + house + "\n" + r.sendText;
  $("verdict").textContent = r.verdict;
  $("pct").textContent = r.laborPct.toFixed(2) + "%";
  $("formula").textContent = r.formula;
  $("move").textContent = r.move;
  $("hold").textContent = r.hold;
  $("text").textContent = body;
  $("send").textContent = "Send this to " + mgr;
  $("out").style.display = "block";
  $("send").onclick = async () => {
    await navigator.clipboard.writeText(body);
    $("send").textContent = "Copied";
  };
};
</script>
</body>
</html>
